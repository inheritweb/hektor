name: Copilot review setup

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-code-review.yml
      - .github/copilot-instructions.md
      - .github/instructions/**
      - package.json
      - yarn.lock
      - .yarnrc.yml
      - '**/package.json'

permissions:
  contents: read

jobs:
  # GitHub requires this job ID, including in a dedicated code-review workflow.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable the repository-pinned Yarn release
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Prepare local example configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
      - name: Verify the review toolchain
        run: |
          node --version
          yarn --version
          yarn workspace @hektor/types typecheck
          yarn workspace @hektor/types test
