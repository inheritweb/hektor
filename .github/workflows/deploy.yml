name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment:
        description: Deployment target
        required: true
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.deployment == 'preview')
    runs-on: ubuntu-latest
    environment: preview
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: cp .env.example .env
      - run: yarn check
      - run: yarn test
      - name: Check Vercel credentials
        id: vercel-credentials
        shell: bash
        run: |
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping preview deployment because Vercel credentials are not configured."
          fi
      - if: steps.vercel-credentials.outputs.available == 'true'
        run: yarn vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - if: steps.vercel-credentials.outputs.available == 'true'
        run: yarn vercel build --token="$VERCEL_TOKEN"
      - if: steps.vercel-credentials.outputs.available == 'true'
        run: yarn vercel deploy --prebuilt --token="$VERCEL_TOKEN"

  production:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deployment == 'production')
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: cp .env.example .env
      - run: yarn check
      - run: yarn test
      - name: Check Vercel credentials
        id: vercel-credentials
        shell: bash
        run: |
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping production deployment because Vercel credentials are not configured."
          fi
      - if: steps.vercel-credentials.outputs.available == 'true'
        run: yarn vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - if: steps.vercel-credentials.outputs.available == 'true'
        run: yarn vercel build --prod --token="$VERCEL_TOKEN"
      - if: steps.vercel-credentials.outputs.available == 'true'
        run: yarn vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
