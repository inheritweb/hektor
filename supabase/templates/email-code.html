<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Hektor sign-in code</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f4f5f7;
      color: #1b1d22;
      font-family: Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #f4f5f7; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 520px;
              background: #ffffff;
              border-collapse: collapse;
            "
          >
            <tr>
              <td style="padding: 40px">
                <p
                  style="
                    margin: 0 0 24px;
                    color: #315c4c;
                    font-size: 12px;
                    font-weight: 700;
                    letter-spacing: 0.2em;
                  "
                >
                  HEKTOR
                </p>
                <h1 style="margin: 0 0 16px; font-size: 28px; line-height: 1.2">
                  Your sign-in code
                </h1>
                <p
                  style="
                    margin: 0 0 24px;
                    color: #5d616b;
                    font-size: 16px;
                    line-height: 1.6;
                  "
                >
                  Enter this code in Hektor to finish signing in. It expires in
                  10 minutes.
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    color: #1b1d22;
                    font-family: monospace;
                    font-size: 32px;
                    font-weight: 700;
                    letter-spacing: 0.2em;
                  "
                >
                  {{ .Token }}
                </p>
                <p
                  style="
                    margin: 0;
                    color: #777b84;
                    font-size: 13px;
                    line-height: 1.6;
                  "
                >
                  If you did not request this code, you can safely ignore this
                  email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
